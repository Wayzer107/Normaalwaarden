<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overzicht – Normaalwaarden NL</title>
  <meta name="description" content="Compact overzicht van alle referentiewaarden (serum en bloedgas, volwassenen, Nederlandse laboratoriumpraktijk).">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6b78'/%3E%3Cpath d='M32 10c8 12 16 20 16 31a16 16 0 0 1-32 0c0-11 8-19 16-31z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("nw-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="ov-page">
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <h1>Normaalwaarden <span class="nl">NL</span> <span class="nl">&middot; overzicht</span></h1>
        <p>Alle referentiewaarden voor volwassenen op één pagina</p>
      </div>
      <div class="top-actions">
        <a class="hdr-link" href="./">Volledige naslag</a>
        <button id="print" class="hdr-link" type="button">Afdrukken</button>
        <button id="theme" class="icon-btn" type="button" aria-label="Wissel tussen licht en donker thema" title="Thema wisselen">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.5-.05-1-.14-1.47A6 6 0 0 1 12 3z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="ov-legend"><b>M</b> = man &middot; <b>V</b> = vrouw<span class="ov-more"> &middot; spreiding tussen laboratoria en toelichting: zie de <a href="./">volledige naslag</a></span></p>
    <div id="ov" class="ov"></div>
  </main>

  <noscript><p class="wrap noscript">Voor deze pagina is JavaScript nodig.</p></noscript>
  <script src="js/data.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/overzicht.js"></script>
</body>
</html>
